<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TinderApp Mobile &mdash; Simulador Interactivo de Portafolio</title>
  <meta name="description" content="Simulador interactivo de TinderApp Mobile desarrollado con Ionic 8, Angular 20, Capacitor 7 y Mock Engine de alta fidelidad.">
  <meta name="author" content="Mileidys Agamez Ospino">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #fd5068;
      --primary-gradient: linear-gradient(135deg, #fd5068 0%, #ff6036 100%);
      --superlike: #2db1ff;
      --like: #10b981;
      --pass: #ef4444;
      --boost: #a855f7;
      --bg-dark: #0f1115;
      --bg-phone: #181a20;
      --bg-card: #22252d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .phone-simulator {
      width: 100%;
      max-width: 412px;
      height: 840px;
      background: var(--bg-phone);
      border-radius: 46px;
      border: 10px solid #2b2f3a;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(253, 80, 104, 0.18);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Notch & Status Bar */
    .phone-notch {
      width: 130px;
      height: 24px;
      background: #2b2f3a;
      border-radius: 0 0 16px 16px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }

    .status-bar {
      height: 38px;
      padding: 8px 24px 0;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      z-index: 90;
    }

    /* App Header */
    .app-header {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      border-bottom: 1px solid var(--border-subtle);
      z-index: 80;
    }

    .brand-flame {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-heading);
      font-weight: 900;
      font-size: 1.35rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    .header-nav-btn {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-muted);
      position: relative;
      padding: 6px;
      transition: color 0.2s;
    }

    .header-nav-btn.active, .header-nav-btn:hover {
      color: #fd5068;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fd5068;
      position: absolute;
      top: 4px;
      right: 4px;
      box-shadow: 0 0 6px #fd5068;
    }

    /* Views Container */
    .app-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .view-screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      padding: 14px 16px 20px;
    }

    .view-screen.active {
      display: flex;
    }

    /* Deck View (Matching) */
    .deck-container {
      flex: 1;
      position: relative;
      margin-bottom: 16px;
      perspective: 1000px;
    }

    .tinder-card {
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background-size: cover;
      background-position: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .tinder-card:active {
      cursor: grabbing;
    }

    .card-gradient-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.92) 100%);
      pointer-events: none;
    }

    .card-badge-overlay {
      position: absolute;
      top: 30px;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.15s ease, transform 0.15s ease;
      pointer-events: none;
      z-index: 10;
    }

    .badge-like {
      left: 24px;
      border: 4px solid var(--like);
      color: var(--like);
      transform: rotate(-16deg);
    }

    .badge-nope {
      right: 24px;
      border: 4px solid var(--pass);
      color: var(--pass);
      transform: rotate(16deg);
    }

    .card-info-content {
      position: relative;
      z-index: 5;
    }

    .user-name-age {
      font-family: var(--font-heading);
      font-size: 1.7rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .verified-badge {
      color: #38bdf8;
      font-size: 1.2rem;
    }

    .user-city {
      font-size: 0.88rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 8px;
    }

    .user-bio {
      font-size: 0.85rem;
      color: #e2e8f0;
      line-height: 1.4;
      margin-bottom: 12px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .passions-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .passion-pill {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Floating Actions Bar */
    .deck-actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px 10px;
      height: 76px;
    }

    .action-circle {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .action-circle:hover {
      transform: scale(1.15);
    }

    .btn-rewind { color: #f59e0b; width: 44px; height: 44px; font-size: 1.1rem; }
    .btn-pass { color: var(--pass); font-size: 1.4rem; }
    .btn-superlike { color: var(--superlike); width: 44px; height: 44px; font-size: 1.1rem; }
    .btn-like { color: var(--like); font-size: 1.5rem; }
    .btn-boost { color: var(--boost); width: 44px; height: 44px; font-size: 1.1rem; }

    /* Matches & Chat Screen */
    .matches-screen {
      padding: 16px;
      overflow-y: auto;
    }

    .section-title-sm {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
    }

    .new-matches-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .new-match-avatar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .avatar-ring {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      padding: 3px;
      background: var(--primary-gradient);
    }

    .avatar-ring img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .match-name-tag {
      font-size: 0.78rem;
      font-weight: 700;
    }

    .conversations-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .conv-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 14px;
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.2s;
    }

    .conv-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .conv-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
    }

    .conv-info {
      flex: 1;
    }

    .conv-name {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .conv-snippet {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }

    /* Chat Room Screen */
    .chat-screen {
      display: none;
      flex-direction: column;
      padding: 0;
      background: var(--bg-phone);
    }

    .chat-header {
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .chat-messages-wrap {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.88rem;
      line-height: 1.4;
      position: relative;
    }

    .msg-mine {
      align-self: flex-end;
      background: var(--primary-gradient);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg-theirs {
      align-self: flex-start;
      background: var(--bg-card);
      color: #f1f5f9;
      border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 4px;
    }

    .chat-input-bar {
      padding: 10px 14px;
      display: flex;
      gap: 8px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-phone);
    }

    .chat-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      padding: 10px 18px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }

    .chat-send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--primary-gradient);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    /* Match Modal */
    .match-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(253, 80, 104, 0.95) 0%, rgba(255, 96, 54, 0.96) 100%);
      backdrop-filter: blur(14px);
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      animation: zoomMatch 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .match-overlay.active {
      display: flex;
    }

    @keyframes zoomMatch {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .match-badge-title {
      font-family: var(--font-heading);
      font-size: 2.8rem;
      font-weight: 900;
      font-style: italic;
      color: #fff;
      text-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      margin-bottom: 6px;
    }

    .match-subtext {
      font-size: 0.95rem;
      color: #ffe4e6;
      margin-bottom: 30px;
    }

    .match-avatars-duo {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }

    .match-avatar-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 4px solid #fff;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .match-avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .match-avatar-left {
      margin-right: -18px;
      z-index: 1;
    }

    .match-actions-col {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-match-chat {
      background: #fff;
      color: var(--primary);
      border: none;
      padding: 14px;
      border-radius: 9999px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
    }

    .btn-match-keep {
      background: transparent;
      border: 2px solid #fff;
      color: #fff;
      padding: 12px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* Simulator Meta Bar Footer */
    .simulator-footer-hint {
      margin-top: 18px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Teléfono Simulador -->
  <div class="phone-simulator">
    <div class="phone-notch"></div>
    <div class="status-bar">
      <span>9:41</span>
      <span>5G 📶 100% 🔋</span>
    </div>

    <!-- Header de la Aplicación -->
    <header class="app-header">
      <div class="brand-flame" id="btn-show-deck">
        <span>🔥</span>
        <span>tinder</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="header-nav-btn active" id="nav-btn-deck" title="Descubrir">🔥</button>
        <button class="header-nav-btn" id="nav-btn-matches" title="Matches y Mensajes">
          💬
          <span class="badge-dot"></span>
        </button>
      </div>
    </header>

    <div class="app-viewport">
      <!-- VISTA 1: DECK DE MATCHING -->
      <section id="view-deck" class="view-screen active">
        <div class="deck-container" id="tinder-deck-container">
          <!-- Tarjetas renderizadas dinámicamente -->
        </div>

        <!-- Botones Flotantes de Acción -->
        <div class="deck-actions-bar">
          <button class="action-circle btn-rewind" id="btn-rewind" title="Rebobinar">↺</button>
          <button class="action-circle btn-pass" id="btn-pass" title="Pasar">✕</button>
          <button class="action-circle btn-superlike" id="btn-superlike" title="Superlike">⭐</button>
          <button class="action-circle btn-like" id="btn-like" title="Me Gusta">💚</button>
          <button class="action-circle btn-boost" id="btn-boost" title="Boost">⚡</button>
        </div>
      </section>

      <!-- VISTA 2: BANDEJA DE MATCHES Y CHATS -->
      <section id="view-matches" class="view-screen matches-screen">
        <div class="section-title-sm">Nuevos Matches</div>
        <div class="new-matches-row" id="new-matches-bar">
          <!-- Inyectado dinámicamente -->
        </div>

        <div class="section-title-sm">Mensajes</div>
        <div class="conversations-list" id="conversations-list-container">
          <!-- Inyectado dinámicamente -->
        </div>
      </section>

      <!-- VISTA 3: SALA DE CHAT EN VIVO -->
      <section id="view-chat-room" class="view-screen chat-screen">
        <div class="chat-header">
          <button id="btn-chat-back" style="background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;">←</button>
          <img id="chat-header-avatar" src="" style="width: 36px; height: 36px; border-radius: 50%; object-fit: cover;">
          <div>
            <div id="chat-header-name" style="font-weight: 700; font-size: 0.95rem;">Usuario</div>
            <div style="font-size: 0.72rem; color: #10b981;">En línea ahora</div>
          </div>
        </div>

        <div class="chat-messages-wrap" id="chat-messages-container">
          <!-- Mensajes dinámicos -->
        </div>

        <div class="chat-input-bar">
          <input type="text" id="chat-msg-input" class="chat-input" placeholder="Escribe un mensaje...">
          <button class="chat-send-btn" id="btn-send-msg">➤</button>
        </div>
      </section>

      <!-- MODAL DE MATCH (¡Es un Match!) -->
      <div class="match-overlay" id="match-modal-overlay">
        <div class="match-badge-title">¡Es un Match!</div>
        <p class="match-subtext" id="match-modal-subtext">A ti y a Sofía se gustaron mutuamente.</p>
        
        <div class="match-avatars-duo">
          <div class="match-avatar-circle match-avatar-left">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=300" alt="Tú">
          </div>
          <div class="match-avatar-circle">
            <img id="match-modal-target-photo" src="" alt="Match">
          </div>
        </div>

        <div class="match-actions-col">
          <button class="btn-match-chat" id="btn-match-open-chat">ENVIAR MENSAJE</button>
          <button class="btn-match-keep" id="btn-match-keep-swiping">SEGUIR EXPLORANDO</button>
        </div>
      </div>
    </div>
  </div>

  <div class="simulator-footer-hint">
    ✨ <strong>TinderApp Mobile Simulator</strong> &bull; Arrastra las tarjetas con el ratón o desliza con el dedo &bull; Ionic 8 / Angular 20
  </div>

  <script>
    // Dataset Mock Autónomo de Alta Fidelidad
    const MOCK_PROFILES = [
      {
        uid: 'user-sofia',
        name: 'Sofía',
        age: 24,
        city: 'Bogotá, Colombia',
        bio: 'Diseñadora UX & aficionada al café de especialidad. Si te gusta el senderismo de montaña, nos llevaremos genial ☕🏔️',
        photo: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=600&auto=format&fit=crop&q=80',
        passions: ['Café', 'Diseño UX', 'Hiking', 'Cine']
      },
      {
        uid: 'user-mateo',
        name: 'Mateo',
        age: 26,
        city: 'Medellín, Colombia',
        bio: 'Arquitecto de software de día, baterista de noche 🎸💻 Buscando a alguien para ir a conciertos y compartir playlists.',
        photo: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=600&auto=format&fit=crop&q=80',
        passions: ['Música', 'Tecnología', 'Conciertos', 'Gatos']
      },
      {
        uid: 'user-valentina',
        name: 'Valentina',
        age: 23,
        city: 'Cali, Colombia',
        bio: 'Fotógrafa urbana. Si te gusta bailar salsa y los viajes por carretera improvisados bajo las estrellas 📸💃🌌',
        photo: 'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=600&auto=format&fit=crop&q=80',
        passions: ['Fotografía', 'Salsa', 'Viajes', 'Arte']
      },
      {
        uid: 'user-lucas',
        name: 'Lucas',
        age: 25,
        city: 'Barranquilla, Colombia',
        bio: 'Chef aficionado y amante del mar. La pasta casera fresca y los atardeceres en la playa son mi debilidad 🍝🌊',
        photo: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=600&auto=format&fit=crop&q=80',
        passions: ['Gastronomía', 'Playa', 'Fitness', 'Perros']
      },
      {
        uid: 'user-isabella',
        name: 'Isabella',
        age: 24,
        city: 'Cartagena, Colombia',
        bio: 'Bióloga marina. Cuidando los arrecifes de coral y buceando en el Caribe 🐠🌊 Siempre lista para un té y un buen libro.',
        photo: 'https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=600&auto=format&fit=crop&q=80',
        passions: ['Buceo', 'Yoga', 'Naturaleza', 'Lectura']
      }
    ];

    let currentIndex = 0;
    let matchesList = [
      {
        profile: MOCK_PROFILES[0],
        lastMsg: '¡Hola! Qué gusto coincidir contigo por aquí 😊'
      }
    ];
    let activeChatUser = null;
    let chatHistories = {
      'user-sofia': [
        { from: 'theirs', text: '¡Hola! Qué gusto coincidir contigo por aquí 😊' }
      ]
    };

    // DOM Elements
    const deckContainer = document.getElementById('tinder-deck-container');
    const viewDeck = document.getElementById('view-deck');
    const viewMatches = document.getElementById('view-matches');
    const viewChat = document.getElementById('view-chat-room');
    const matchModal = document.getElementById('match-modal-overlay');

    function renderCard() {
      deckContainer.innerHTML = '';
      if (currentIndex >= MOCK_PROFILES.length) {
        deckContainer.innerHTML = `
          <div style="text-align: center; padding-top: 140px; color: var(--text-muted);">
            <div style="font-size: 3.5rem; margin-bottom: 12px;">💫</div>
            <h3 style="color: #fff; margin-bottom: 6px;">No hay más perfiles</h3>
            <p style="font-size: 0.9rem; max-width: 260px; margin: 0 auto 20px;">Has revisado todos los candidatos cercanos en este momento.</p>
            <button onclick="resetDeck()" style="background: var(--primary-gradient); color: #fff; border: none; padding: 10px 22px; border-radius: 9999px; font-weight: 700; cursor: pointer;">Reiniciar Explorador</button>
          </div>
        `;
        return;
      }

      const p = MOCK_PROFILES[currentIndex];
      const card = document.createElement('div');
      card.className = 'tinder-card';
      card.style.backgroundImage = `url('${p.photo}')`;

      card.innerHTML = `
        <div class="card-badge-overlay badge-like">LIKE</div>
        <div class="card-badge-overlay badge-nope">NOPE</div>
        <div class="card-gradient-overlay"></div>
        <div class="card-info-content">
          <div class="user-name-age">
            ${p.name}, ${p.age} <span class="verified-badge">✓</span>
          </div>
          <div class="user-city">📍 ${p.city}</div>
          <div class="user-bio">${p.bio}</div>
          <div class="passions-row">
            ${p.passions.map(pass => `<span class="passion-pill">${pass}</span>`).join('')}
          </div>
        </div>
      `;

      attachSwipeGestures(card);
      deckContainer.appendChild(card);
    }

    function attachSwipeGestures(card) {
      let isDragging = false;
      let startX = 0;
      let currentX = 0;

      const badgeLike = card.querySelector('.badge-like');
      const badgeNope = card.querySelector('.badge-nope');

      function start(clientX) {
        isDragging = true;
        startX = clientX;
      }

      function move(clientX) {
        if (!isDragging) return;
        currentX = clientX;
        const deltaX = currentX - startX;
        const rot = deltaX * 0.06;

        card.style.transform = `translateX(${deltaX}px) rotate(${rot}deg)`;

        if (deltaX > 40) {
          const opacity = Math.min(1, (deltaX - 40) / 100);
          badgeLike.style.opacity = opacity;
          badgeNope.style.opacity = 0;
        } else if (deltaX < -40) {
          const opacity = Math.min(1, Math.abs(deltaX + 40) / 100);
          badgeNope.style.opacity = opacity;
          badgeLike.style.opacity = 0;
        } else {
          badgeLike.style.opacity = 0;
          badgeNope.style.opacity = 0;
        }
      }

      function end() {
        if (!isDragging) return;
        isDragging = false;
        const deltaX = currentX - startX;

        if (deltaX > 110) {
          swipe('right');
        } else if (deltaX < -110) {
          swipe('left');
        } else {
          card.style.transition = 'transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
          card.style.transform = 'translateX(0) rotate(0)';
          badgeLike.style.opacity = 0;
          badgeNope.style.opacity = 0;
          setTimeout(() => card.style.transition = 'none', 350);
        }
      }

      // Mouse events
      card.addEventListener('mousedown', e => start(e.clientX));
      window.addEventListener('mousemove', e => move(e.clientX));
      window.addEventListener('mouseup', end);

      // Touch events
      card.addEventListener('touchstart', e => start(e.touches[0].clientX));
      card.addEventListener('touchmove', e => move(e.touches[0].clientX));
      card.addEventListener('touchend', end);
    }

    function swipe(dir) {
      const card = deckContainer.querySelector('.tinder-card');
      if (!card) return;

      const flyX = dir === 'right' ? 800 : -800;
      card.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
      card.style.transform = `translateX(${flyX}px) rotate(${flyX * 0.05}deg)`;
      card.style.opacity = '0';

      const candidate = MOCK_PROFILES[currentIndex];

      setTimeout(() => {
        currentIndex++;
        renderCard();

        if (dir === 'right') {
          triggerMatch(candidate);
        }
      }, 350);
    }

    function triggerMatch(profile) {
      matchesList.unshift({
        profile: profile,
        lastMsg: '¡Nuevo Match! Saluda a ' + profile.name
      });
      chatHistories[profile.uid] = [
        { from: 'theirs', text: `¡Hola! Me encantó tu perfil ✨ ¿Qué tal tu día?` }
      ];

      document.getElementById('match-modal-target-photo').src = profile.photo;
      document.getElementById('match-modal-subtext').textContent = `Tú y ${profile.name} se han gustado mutuamente.`;
      matchModal.classList.add('active');

      activeChatUser = profile;
      renderMatchesScreen();
    }

    function resetDeck() {
      currentIndex = 0;
      renderCard();
    }

    // Modal Events
    document.getElementById('btn-match-keep-swiping').onclick = () => {
      matchModal.classList.remove('active');
    };

    document.getElementById('btn-match-open-chat').onclick = () => {
      matchModal.classList.remove('active');
      openChatWith(activeChatUser);
    };

    // Floating Button Controls
    document.getElementById('btn-like').onclick = () => swipe('right');
    document.getElementById('btn-pass').onclick = () => swipe('left');
    document.getElementById('btn-superlike').onclick = () => swipe('right');
    document.getElementById('btn-rewind').onclick = () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard();
      }
    };

    // Navigation
    const navDeck = document.getElementById('nav-btn-deck');
    const navMatches = document.getElementById('nav-btn-matches');

    navDeck.onclick = () => {
      navDeck.classList.add('active');
      navMatches.classList.remove('active');
      viewDeck.classList.add('active');
      viewMatches.classList.remove('active');
      viewChat.classList.remove('active');
    };

    navMatches.onclick = () => {
      navMatches.classList.add('active');
      navDeck.classList.remove('active');
      viewMatches.classList.add('active');
      viewDeck.classList.remove('active');
      viewChat.classList.remove('active');
      renderMatchesScreen();
    };

    function renderMatchesScreen() {
      const newMatchesBar = document.getElementById('new-matches-bar');
      const convList = document.getElementById('conversations-list-container');

      newMatchesBar.innerHTML = matchesList.map(m => `
        <div class="new-match-avatar" onclick="openChatWithByUid('${m.profile.uid}')">
          <div class="avatar-ring">
            <img src="${m.profile.photo}" alt="${m.profile.name}">
          </div>
          <span class="match-name-tag">${m.profile.name}</span>
        </div>
      `).join('');

      convList.innerHTML = matchesList.map(m => `
        <div class="conv-item" onclick="openChatWithByUid('${m.profile.uid}')">
          <img src="${m.profile.photo}" alt="${m.profile.name}" class="conv-avatar">
          <div class="conv-info">
            <div class="conv-name">${m.profile.name}</div>
            <div class="conv-snippet">${m.lastMsg}</div>
          </div>
          <span style="font-size: 0.75rem; color: var(--text-muted);">Ahora</span>
        </div>
      `).join('');
    }

    function openChatWithByUid(uid) {
      const found = matchesList.find(m => m.profile.uid === uid);
      if (found) openChatWith(found.profile);
    }

    function openChatWith(profile) {
      activeChatUser = profile;
      document.getElementById('chat-header-name').textContent = profile.name;
      document.getElementById('chat-header-avatar').src = profile.photo;

      viewDeck.classList.remove('active');
      viewMatches.classList.remove('active');
      viewChat.classList.add('active');

      renderChatMessages();
    }

    function renderChatMessages() {
      const container = document.getElementById('chat-messages-container');
      const msgs = chatHistories[activeChatUser.uid] || [];
      container.innerHTML = msgs.map(m => `
        <div class="msg-bubble ${m.from === 'mine' ? 'msg-mine' : 'msg-theirs'}">
          ${m.text}
        </div>
      `).join('');
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('btn-chat-back').onclick = () => {
      viewChat.classList.remove('active');
      viewMatches.classList.add('active');
    };

    // Chat Send Logic
    function handleSend() {
      const input = document.getElementById('chat-msg-input');
      const text = input.value.trim();
      if (!text || !activeChatUser) return;

      if (!chatHistories[activeChatUser.uid]) chatHistories[activeChatUser.uid] = [];
      chatHistories[activeChatUser.uid].push({ from: 'mine', text: text });
      input.value = '';
      renderChatMessages();

      // Simulated auto-reply after 1.2s
      setTimeout(() => {
        const replies = [
          '¡Jajaja qué bien! Me caes súper bien 😊',
          '¡Totalmente de acuerdo! Qué gran plan 👌',
          'Deberíamos ir por un café o algo pronto ☕',
          '¡Qué interesante! Cuéntame más sobre eso ✨'
        ];
        const randomReply = replies[Math.floor(Math.random() * replies.length)];
        chatHistories[activeChatUser.uid].push({ from: 'theirs', text: randomReply });
        renderChatMessages();
      }, 1200);
    }

    document.getElementById('btn-send-msg').onclick = handleSend;
    document.getElementById('chat-msg-input').onkeydown = e => {
      if (e.key === 'Enter') handleSend();
    };

    // Inicializar
    renderCard();
  </script>
</body>
</html>
