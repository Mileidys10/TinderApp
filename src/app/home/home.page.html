<ion-header>
  <ion-toolbar color="danger">
    <ion-title>
      <div class="header-logo">
        <ion-icon name="flame"></ion-icon>
        <span>tinder</span>
      </div>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="home-content">
  <div class="welcome-section">
    <h1>Welcome back, {{ userName }}!</h1>
    <p>Ready to find your match?</p>
  </div>

  <div class="stats-card">
    <div class="stat-item">
      <ion-icon name="heart" color="danger"></ion-icon>
      <div>
        <h3>{{ matchesCount }}</h3>
        <p>Matches</p>
      </div>
    </div>
  </div>

  <div class="action-cards">
    <ion-card button (click)="goToMatching()" class="action-card discover-card">
      <ion-card-content>
        <div class="card-icon">
          <ion-icon name="people" size="large"></ion-icon>
        </div>
        <h2>Discover</h2>
        <p>Start swiping and find your match</p>
      </ion-card-content>
    </ion-card>

    <ion-card button (click)="goToMatches()" class="action-card matches-card">
      <ion-card-content>
        <div class="card-icon">
          <ion-icon name="chatbubbles" size="large"></ion-icon>
        </div>
        <h2>Messages</h2>
        <p>Chat with your matches</p>
        <ion-badge *ngIf="matchesCount > 0" color="danger">
          {{ matchesCount }}
        </ion-badge>
      </ion-card-content>
    </ion-card>

    <ion-card button (click)="goToProfile()" class="action-card profile-card">
      <ion-card-content>
        <div class="card-icon">
          <ion-icon name="person" size="large"></ion-icon>
        </div>
        <h2>Profile</h2>
        <p>Edit your profile and settings</p>
      </ion-card-content>
    </ion-card>
  </div>

  <ion-button 
    expand="block" 
    color="light" 
    class="logout-button"
    (click)="logOut()">
    <ion-icon name="log-out-outline" slot="start"></ion-icon>
    Sign Out
  </ion-button>
</ion-content>
